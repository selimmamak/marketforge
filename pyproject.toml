[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge"
version = "0.1.0"
description = "Leakage-aware stock forecasting research with nested temporal validation and cost-aware evaluation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2",
  "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "joblib>=1.3,<2",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.54,<1"]
boosting = ["xgboost>=2,<3"]
neural = ["torch>=2.2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
all = ["yfinance>=0.2.54,<1", "xgboost>=2,<3", "torch>=2.2,<3", "pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
marketforge = "marketforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
